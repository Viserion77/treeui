name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Before the tests, because a stale generated file is a faster and clearer
      # failure than whatever a port would do with last release's colours.
      - name: Generated Kotlin and Rust tokens are up to date
        run: pnpm codegen:native:check

      - name: Unit tests
        run: pnpm test

      - name: Build packages
        run: pnpm build:packages

      # After the build on purpose: the fixtures import the BUILT package, which
      # is what a consumer installs, and where the defect this gate covers lived.
      - name: Typecheck consumer templates (strictTemplates)
        run: pnpm typecheck:strict-templates

      # Also after the build: the validator is imported from `dist`, and the
      # example is the worked demonstration of MIGRATION.md -> Path D, so a
      # shipped accent that stops passing the colour contract is a red build.
      - name: Validate the example's accent presets (colour contract)
        run: pnpm check:theme

      - name: Build docs site (landing + Vue + React Storybooks)
        run: pnpm build:site

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke tests
        env:
          PW_SKIP_BUILD: "1"
        run: pnpm test:e2e

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 1

  # The Kotlin/Android port. Its own job rather than a step in `validate`: it
  # needs a JDK and the Android SDK, shares nothing with the Node toolchain, and
  # a Gradle problem should not redden the npm packages or hold up the site.
  #
  # The generated token source is NOT regenerated here — `validate` already
  # failed the build if it were stale, so this job compiles exactly what is
  # committed, which is what a consumer gets.
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and test the Compose port
        working-directory: packages/compose
        run: ./gradlew build

  # The Rust/desktop port. `-D warnings` on top of the workspace lints, so a new
  # warning cannot accumulate: the crate already denies `missing_docs` and
  # forbids `unsafe_code`, and this makes everything else as loud.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/egui
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/egui

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all

      # The token crate is the one piece every ecosystem shares, so it may not
      # acquire a dependency a consumer of a different renderer would carry.
      - name: The token crate has no dependencies
        run: |
          DEPS="$(cargo tree --package treeui-tokens --edges normal --prefix none --no-dedupe | tail -n +2)"
          if [ -n "$DEPS" ]; then
            echo "treeui-tokens must stay dependency-free, but it pulls in:"
            echo "$DEPS"
            exit 1
          fi
          echo "treeui-tokens has no dependencies."

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Verify publish tarballs
        run: |
          TOKENS_PACK_OUTPUT="$(pnpm --filter @treeui/tokens exec npm --cache /tmp/npm-cache-tokens pack --dry-run 2>&1)"
          printf '%s\n' "$TOKENS_PACK_OUTPUT"
          grep -F "dist/styles.css" <<<"$TOKENS_PACK_OUTPUT"
          grep -F "dist/index.js" <<<"$TOKENS_PACK_OUTPUT"

          VUE_PACK_OUTPUT="$(pnpm --filter @treeui/vue exec npm --cache /tmp/npm-cache-vue pack --dry-run 2>&1)"
          printf '%s\n' "$VUE_PACK_OUTPUT"
          grep -F "dist/style.css" <<<"$VUE_PACK_OUTPUT"
          grep -F "dist/index.js" <<<"$VUE_PACK_OUTPUT"

          MCP_PACK_OUTPUT="$(pnpm --filter @treeui/mcp exec npm --cache /tmp/npm-cache-mcp pack --dry-run 2>&1)"
          printf '%s\n' "$MCP_PACK_OUTPUT"
          grep -F "dist/index.js" <<<"$MCP_PACK_OUTPUT"
          grep -F "dist/cli.js" <<<"$MCP_PACK_OUTPUT"

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
          publish: pnpm -w exec changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  upload-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: upload-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

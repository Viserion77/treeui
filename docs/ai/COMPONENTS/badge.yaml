name: TBadge
source_file: packages/vue/src/components/TBadge.vue
package: "@treeui/vue"
kind: display
status: available
purpose: "Compact status or metadata label with optional icon."

props:
  variant:
    type: TVariant
    default: soft
    values: [solid, outline, ghost, soft, danger]
    description: "Surface treatment. Selects which --tree-badge-<variant>-* colour variables the badge consumes; danger is a surface style, not a semantic guarantee — its red palette is replaced when tone is success, warning, or info."
  tone:
    type: TBadgeTone
    default: neutral
    values: [neutral, success, warning, danger, info]
    description: "Semantic palette. Re-maps the --tree-badge-* colour variables that the chosen variant consumes, so it recolours the badge without changing its surface treatment. neutral keeps the brand palette."
  size:
    type: TSize
    default: md
    values: [sm, md, lg]
    description: "Changes min-height and font-size only; inline padding is constant across sizes."
  truncate:
    type: boolean
    default: false
    description: "Keep the label on one line and clip it with an ellipsis. Opt-in: the default is to wrap, because a status pill that silently loses the end of its text is worse than a two-line pill. Pass `label` alongside it so the full text reaches the `title` tooltip."
  label:
    type: string
    default: undefined
    description: "The badge text. Only needed with `truncate`, which puts it in `title`; otherwise use the default slot."

events: []

slots:
  - icon
  - default

forwards_attrs_to: root_element

a11y:
  semantic_element: span
  interactive_by_default: false
  icon_slot_marked_aria_hidden: true
  tone_conveys_meaning_by_color_only: "No role or aria state is set, so put the status word in the badge text rather than relying on tone alone."

behavior:
  always_applies_one_modifier_per_prop: true
  tone_remaps_variant_color_variables: true
  tone_overrides_variant_danger_palette: true
  tone_neutral_has_no_stylesheet_rule: true
  tint_ink_is_the_on_soft_token: >-
    The `soft` and `danger` variants paint their label with the tone's
    `*-on-soft` colour, never the tone's full-strength colour. `*-on-soft` is
    derived to clear AA on that exact tint and deepens as the tint deepens; the
    full-strength tone on its own tint measured below AA for eight of the ten
    tone/theme pairs, including `variant="soft" tone="neutral"`, which is both
    defaults. The mapping is declared in `@treeui/tokens` as `NATIVE_BADGE_TONES`
    and the stylesheet is tested against it.
  icon_wrapper_rendered_only_when_slot_filled: true
  icon_renders_before_default_slot: true
  never_wider_than_its_container: >-
    The badge carries `max-inline-size: 100%` and `min-inline-size: 0`, so a
    long label wraps inside the container instead of pushing it. Wrapped lines
    use the UI line height with block padding rather than `line-height: 1`, at
    which a second line's ascenders touched the pill's border.

css:
  block: t-badge
  modifiers:
    - t-badge--solid
    - t-badge--outline
    - t-badge--ghost
    - t-badge--soft
    - t-badge--danger
    - t-badge--sm
    - t-badge--md
    - t-badge--lg
    - t-badge--tone-neutral
    - t-badge--tone-success
    - t-badge--tone-warning
    - t-badge--tone-danger
    - t-badge--tone-info
  state_classes:
    - is-truncated
  elements:
    - t-badge__icon
    - t-badge__label

example: '<TBadge variant="soft" tone="success">Stable foundation</TBadge>'

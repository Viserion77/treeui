name: TGrid
source_file: packages/vue/src/components/TGrid.vue
package: "@treeui/vue"
kind: layout
status: available
purpose: "Responsive grid wrapper for cards, forms, stats, and other multi-column layouts."

props:
  as:
    type: string
    default: div
  columns:
    type: number
    default: auto-fit
  minItemWidth:
    type: string
    default: 16rem
  gap:
    type: string
    default: var(--tree-space-4)
  rowGap:
    type: string
    default: gap
  align:
    type: string
    default: stretch
  justify:
    type: string
    default: stretch
  dense:
    type: boolean
    default: false
  balance:
    type: boolean
    default: false
    note: >
      Let the last row divide itself among the items it has instead of leaving
      empty tracks to its right — five cards over four tracks read as "one card
      failed to load". `auto-fit` cannot do it: it collapses a track only when
      that track is empty on EVERY row, so the remainder row keeps the widths of
      the rows above it. Balanced mode lays out with flex, where each line sizes
      itself: full rows are identical to the grid, only the remainder is shared
      out. Ignored when `columns` is set, since a declared track count already
      answers the same question.

slots:
  - default

behavior:
  semantic_element_controlled_by_as: true
  balance_shares_the_last_row_instead_of_leaving_holes: true
  fixed_columns_supported: true
  auto_fit_columns_supported: true
  dense_mode_uses_grid_auto_flow_dense: true

a11y:
  - "Acts as a layout wrapper only; semantics come from child content and optional `as` prop."

example: |
  <TGrid min-item-width="14rem" gap="var(--tree-space-3)">
    <TStat label="MRR" value="$48.2k" />
    <TStat label="Users" value="18,420" />
  </TGrid>

list_semantics:
  note: >
    With `as="ul"`/`"ol"`/`"menu"` the primitive cancels the user-agent list box
    (marker, indent, block margin) so the three-line reset stops being copied
    into every consumer, and sets `role="list"` back — `list-style: none` makes
    Safari/VoiceOver drop the list role, which is the whole reason `as="ul"` was
    chosen. A `role` passed by the consumer still wins. Semantics are untouched:
    the element is a real `<ul>`/`<li>` in the accessibility tree.
  css: ':where(ul, ol, menu):is(.t-grid, …)'

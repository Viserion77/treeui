name: TInput
source_file: packages/vue/src/components/TInput.vue
package: "@treeui/vue"
kind: primitive
status: available
purpose: "Text input with size, loading, invalid, and prefix or suffix slots."

props:
  modelValue:
    type: T
    default: undefined
    note: >
      Generic over `T extends string | number`, so a `ref<number>` binds without
      a cast and `update:modelValue` pays back a number. `<script setup>` was
      widening every model to `string | number`, which under a consumer's
      `strictTemplates` made a numeric field a type error at the call site with
      no correct way to write it (TREEUX-011, group 3). When `T` is `number` the
      component parses the raw input value and only falls back to the raw string
      when it does not parse.
  size:
    type: TSize
    default: md
    values: [sm, md, lg]
  width:
    type: TFieldWidth
    default: full
    values: [xs, sm, md, lg, xl, full]
    note: "Inline-size cap (max-inline-size). Fluid by default; use instead of an inline width style."
  disabled:
    type: boolean
    default: false
  loading:
    type: boolean
    default: false
  invalid:
    type: boolean
    default: false
  type:
    type: string
    default: text
  placeholder:
    type: string
    default: ""

events:
  - update:modelValue

slots:
  - prefix
  - suffix

forwards_attrs_to: native_input

element_attributes:
  note: >
    Declared as props and bound to the native input, rather than left to
    fallthrough. Fallthrough works at RUNTIME but is invisible to `vue-tsc`
    under `strictTemplates`, so a consumer writing `<TInput :max="10" />` in a
    typechecked app got an error with no correct alternative — the shape a
    number field needs was untypeable (TREEUX-011, group 1).
  declared: [min, max, step, minlength, maxlength, pattern, inputmode, autocomplete, name, required, readonly]
  inputmode_values: [none, text, decimal, numeric, tel, search, email, url]

a11y:
  aria_invalid_when_invalid: true
  loading_uses_status_spinner: true

behavior:
  update_payload_type: string
  loading_does_not_disable_by_itself: true

example: '<TInput aria-label="Project name" :model-value="name" @update:model-value="name = $event" />'

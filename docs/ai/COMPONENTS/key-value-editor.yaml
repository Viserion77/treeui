name: TKeyValueEditor
source_file: packages/vue/src/components/TKeyValueEditor.vue
package: "@treeui/vue"
kind: form
status: available
purpose: "Edit a Record<string, string> as add/removable key/value rows with per-row validation. An editor (distinct from TDescriptionList, which only displays)."

notes: >
  Phase 1 (non-sensitive) is shipped: the full value round-trips through v-model.
  A write-only/sensitive phase 2 (value never reaches the client; modelValue is
  Record<string, { set: boolean }> with set-value/clear-value events) is a closed
  contract on the queue and NOT yet implemented — do not assume it exists.

props:
  modelValue:
    type: "Record<string, string>"
    default: "{}"
    note: "The edited map. Full value round-trips (non-sensitive mode)."
  size:
    type: TSize
    default: md
    values: [sm, md, lg]
  disabled:
    type: boolean
    default: false
  invalid:
    type: boolean
    default: false
    note: "Marks the whole control invalid (e.g. mirrors a TFormField summary error)."
  labels:
    type: TKeyValueEditorLabels
    default: "{}"
    note: "Localizable copy merged over English defaults: key, value, add, remove, emptyKey, duplicateKey."

events:
  - update:modelValue
  - "validity-change: emits { valid: boolean; errors: string[] } — deduped, localized messages to feed a TFormField summary."

a11y:
  per_row_key_aria_invalid: true
  row_error_linked_by_aria_describedby: true
  remove_button_has_accessible_name: true

behavior:
  rows_add_and_remove: true
  inline_per_row_validation: true
  empty_key_flagged_only_when_value_present: true
  duplicate_key_flagged_on_later_occurrence: true
  invalid_rows_blocked_from_commit_without_blocking_typing: true
  aggregated_errors_via_validity_change_event: true

example: |
  <TFormField label="Brand colors" :error="summary">
    <TKeyValueEditor
      :model-value="colors"
      :labels="{ key: 'Token', value: 'Hex' }"
      @update:model-value="colors = $event"
      @validity-change="summary = $event.valid ? '' : $event.errors.join(' ')"
    />
  </TFormField>

validity_emission:
  note: >
    `validity-change` is emitted on mount, on every real change, and whenever
    `modelValue` changes from outside — not only on keystroke. A Record can
    ARRIVE invalid (`{"": "x"}` is a legitimate `Record<string, string>` and the
    control mounts already showing the row error), and after an external reset
    the rows can render clean while the consumer's aggregated summary still says
    invalid. Repeat emissions of an unchanged validity are suppressed.

external_updates:
  note: >
    The rows are rebuilt from `modelValue` only when it differs BY CONTENT from
    what the editor last emitted. A reference check is wrong here: a parent
    holding the map in `reactive()`/`ref()` hands back a proxy that is never
    `===` the raw object, so the guard failed on every keystroke and rebuilt the
    rows from the committed record — which by contract omits the row being
    edited, so clearing a key deleted that row and its value. Row ids of
    surviving keys are reused, so an external change patches inputs instead of
    remounting them and stealing the caret.

identity:
  note: >
    An incoming `id` (explicit, or from a TFormField) lands on the FIRST key
    input, never on the wrapper `div` — a `<label for>` has to name a real
    control. The root is `role="group"` and carries `aria-invalid` when
    `invalid` is set, which also draws an error rail
    (`.t-key-value-editor.is-invalid`); the prop used to apply a class with no
    rule behind it.

known_behaviour:
  numeric_keys: >
    Renaming a key to an integer-like string ("10") moves its row to the top of
    the emitted Record — JavaScript itself orders integer-like keys first. It
    does not affect colour tokens or env names; it matters if the component is
    reused for a map with numeric keys.

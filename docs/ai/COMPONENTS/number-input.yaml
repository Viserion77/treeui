name: TNumberInput
source_file: packages/vue/src/components/TNumberInput.vue
package: "@treeui/vue"
kind: form
status: available
purpose: "Numeric input with optional increment and decrement controls."

props:
  modelValue:
    type: "number | null"
    default: null
    note: >
      `null` is REAL, not an error state: clearing the field is empty, and the
      component emits `null` for it. So `v-model` needs a `ref<number | null>`,
      and a `ref<number>` is a genuine type error under a consumer's
      `strictTemplates` rather than a gap in the library. This is the one place
      in the round where the checker was right and the call site was wrong — the
      others (TInput, TTabs, TToggleGroup) were the library's fault.
  min:
    type: number
    default: undefined
  max:
    type: number
    default: undefined
  step:
    type: number
    default: 1
  size:
    type: TSize
    default: md
    values: [sm, md, lg]
  disabled:
    type: boolean
    default: false
  invalid:
    type: boolean
    default: false
  placeholder:
    type: string
    default: ""
  controls:
    type: boolean
    default: true

events:
  - update:modelValue

slots: []

a11y:
  native_input_type: number
  keyboard_arrow_up_down: true
  home_sets_min_when_present: true
  end_sets_max_when_present: true
  aria_invalid_when_invalid: true

behavior:
  empty_value_is_null: true
  values_clamped_to_min_and_max: true
  decimal_steps_supported: true
  control_buttons_optional: true

example: |
  <TNumberInput
    aria-label="Seats"
    :model-value="seats"
    :min="0"
    :max="20"
    @update:model-value="seats = $event"
  />

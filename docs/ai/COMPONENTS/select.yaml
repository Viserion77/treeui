name: TSelect
source_file: packages/vue/src/components/TSelect.vue
package: "@treeui/vue"
kind: primitive
status: available
purpose: "Custom styled dropdown select with listbox; controlled and uncontrolled via v-model and open/defaultOpen."

generic:
  parameter: "T extends string | number = string"
  note: >-
    `TSelect` is generic over its value, so a `ref<'scan' | 'query'>` gets its
    own literal union back from `v-model` instead of a widened `string | number`
    — the same move `TInput`, `TTabs` and `TToggleGroup` already made. Consumers
    with `strictTemplates` on no longer need a cast at the binding.

props:
  modelValue:
    type: "T"
    default: undefined
  options:
    type: "TSelectOption<T>[]"
    default: "[]"
    note: "Array of { label: string; value: T; disabled?: boolean }"
  open:
    type: boolean
    default: undefined
  defaultOpen:
    type: boolean
    default: false
  size:
    type: TSize
    default: md
    values: [sm, md, lg]
  width:
    type: TFieldWidth
    default: full
    values: [xs, sm, md, lg, xl, full]
    note: "Inline-size cap (max-inline-size). Fluid by default; use instead of an inline width style."
  disabled:
    type: boolean
    default: false
  loading:
    type: boolean
    default: false
  invalid:
    type: boolean
    default: false
  placeholder:
    type: string
    default: ""

events:
  - update:modelValue
  - update:open
  - open-change

slots:
  - prefix

forwards_attrs_to: trigger_button

a11y:
  role: listbox
  trigger_aria_haspopup: listbox
  trigger_aria_expanded: true
  aria_invalid_when_invalid: true
  aria_busy_when_loading: true
  aria_selected_on_options: true
  aria_disabled_on_disabled_options: true
  focus_visible_on_trigger: true
  keyboard_arrow_navigation: true
  escape_closes_dropdown: true
  enter_space_selects_option: true
  home_end_navigation: true

behavior:
  update_payload_type: "string | number"
  loading_does_not_disable_by_itself: true
  placeholder_shown_as_muted_text: true
  chevron_rotates_when_open: true
  check_icon_on_selected_option: true
  outside_click_closes_dropdown: true
  focus_restores_on_close: true
  numeric_values_supported_without_string_coercion: true
  listbox_flips_above_trigger_when_space_below_is_insufficient: true
  option_label_wraps_instead_of_being_clipped: >-
    `.t-select__option` carries `overflow-wrap: anywhere`, so a label without a
    break opportunity wraps inside the listbox rather than overflowing it and
    being cut off.
  listbox_is_teleported_to_the_body: >-
    The listbox renders through `<Teleport to="body">` and is placed with
    `position: fixed` from the trigger's viewport rect by the `useAnchoredLayer`
    composable, matching the trigger's width. It used to be positioned inside
    the root, which meant ANY ancestor with `overflow` clipped it — the TTable
    wrapper cut it off and a modal trapped it. Consequences for tests: the
    listbox is not a descendant of the component's root element, so query it
    from `document.body`.

example: |
  <TSelect
    aria-label="Fruit"
    placeholder="Choose a fruit"
    :options="[
      { label: 'Apple', value: 'apple' },
      { label: 'Banana', value: 'banana' },
    ]"
    :model-value="fruit"
    @update:model-value="fruit = $event"
  />

name: TStat
source_file: packages/vue/src/components/TStat.vue
package: "@treeui/vue"
kind: data-display
status: available
purpose: "Compact KPI display with label, value, trend, metadata, and optional icon."

props:
  label:
    type: string
    default: ""
  value:
    type: "string | number"
    default: ""
  trend:
    type: string
    default: ""
  meta:
    type: string
    default: ""
  tone:
    type: TStatTone
    default: neutral
    values: [neutral, success, warning, danger, info]
  trendDirection:
    type: TStatTrendDirection
    default: neutral
    values: [up, down, neutral]
  loading:
    type: boolean
    default: false
  emphasis:
    type: TStatEmphasis
    default: label
    values: [label, value]
    note: >
      Which half leads. `label` is the dashboard reading — the eye is scanning
      for what is measured. `value` puts the figure first, for a marketing band
      where the number IS the argument; it also keeps a row of figures on one
      baseline, because the labels above them no longer have to be the same
      height. Visual order only: the DOM keeps label before value, so the
      announcement stays "Requests served, 4.2M".

slots:
  - icon
  - label
  - value
  - trend
  - meta

behavior:
  value_and_trend_are_optional: true
  emphasis_reorders_visually_not_in_the_dom: true
  icon_slot_adds_visual_emphasis: true
  trend_indicator_changes_with_direction: true
  loading_renders_internal_skeleton_placeholders: true

a11y:
  - "Use clear label text so the metric remains understandable to assistive technologies."
  - "Trend indicator symbols are decorative when slot content already explains the change."

example: |
  <TStat label="MRR" value="$48.2k" trend="12.4%" tone="success" trend-direction="up" />

component: TTable
status: available
package: "@treeui/vue"
source: TTable.vue
description: Sortable, accessible data table with column definitions and row data.

props:
  stackBelow:
    type: TBreakpoint
    default: undefined
    values: [sm, md, lg, xl]
    description: >-
      Below this CONTAINER width the grid becomes one block per row: the column
      marked `stack="title"` is the block's heading, the rest sit under it, and
      each value carries its column's label because the header row is gone.
      Above it the table is unchanged, horizontal scroll included. Measured on
      the wrapper and not the viewport — a table can sit in a narrow panel on a
      wide screen, which is the case a media query cannot see. A breakpoint
      name and not a free length: a container query cannot read a custom
      property in its condition, so an arbitrary value would need a
      ResizeObserver per table.
  columns:
    type: "TTableColumn[]"
    required: true
    description: Array of column definitions with key, label, sortable, align, width, and minWidth.
  rows:
    type: "Record<string, unknown>[]"
    required: true
    description: Array of row data objects keyed by column keys.
  size:
    type: TSize
    default: md
    values: [sm, md, lg]
  sortBy:
    type: TTableSortState
    required: false
    description: Controlled sort state. When provided, overrides internal sort tracking.
  caption:
    type: string
    required: false
    description: Visible `<caption>` naming the table.
    note: "For a name without visible text, pass `aria-label` / `aria-labelledby` instead — attribute inheritance is disabled and every non-class/style attr is forwarded to the `<table>`, so the name lands on the named element rather than the scroll wrapper."
  rowKey:
    type: "string | ((row, index) => string | number)"
    required: false
    description: "Stable per-row identity. A field name or a function of the row, so rows keep identity across sorting. Without it Vue keys by array index and rowState styling would follow the position, not the data. Falls back to the index."
  rowState:
    type: "(row, index) => 'default' | 'muted'"
    required: false
    description: "Semantic per-row state applied by data, not position, so it survives sorting. `muted` recesses a row (e.g. a resource that no longer exists) via `t-table__row--muted`, written at compound specificity so it wins over the zebra/hover rules."
    a11y_note: "Dimming is a visual aid only, never the sole signal — pair `muted` with a status cell (TBadge/TTag) or visually hidden text conveying the same meaning, per the accessible-by-default practice."

events:
  sort:
    payload: "TTableSortState"
    description: Emitted when a sortable column header is clicked.

slots:
  "cell-{key}":
    description: Custom cell renderer for a specific column. Receives `{ row, value }`.
    note: "Use this when the displayed value does not come directly from `row[column.key]` or needs custom markup."
  "header-{key}":
    description: Custom header renderer for a specific column. Receives `{ column }`.
  empty:
    description: Content shown when rows array is empty.

types:
  TTableColumn:
    key: string
    label: string
    sortable: boolean (optional)
    align: "'left' | 'center' | 'right' (optional)"
    width: string (optional)
    stack: |
      'title' | 'field' | 'hidden' (optional, default 'field'). What the column
      becomes in stacked mode. `title` makes it the block's heading and drops
      its caption — there is at most one, and the first column declaring it
      wins, because two headings in one block is not a block. `hidden` drops
      the column from the block, for something that only makes sense beside its
      neighbours. `field` shows the column's `label` above the value.
    minWidth: |
      string (optional). A width the column may not go below. Unlike `width`
      this is a real floor: under `table-layout: auto` — which is what this
      table uses, so columns size to their content — a CSS `width` on a cell is
      only a SUGGESTION and the algorithm goes under it when the row is tight.
      `minWidth` is applied to a box inside the header instead, which the auto
      layout has to honour, so the table overflows into the wrapper's scroll
      rather than squeezing the column to nothing. Use it for content that must
      stay readable: a timestamp, an id, an amount.
  TTableSortState:
    key: string
    direction: "'asc' | 'desc' | 'none'"

forwards_attrs_to: table_element
attr_inheritance: "inheritAttrs is false. `class` and `style` stay on the `.t-table-wrapper` scroll container (the root); every other attribute — aria-label, aria-labelledby, id, data-* — is forwarded to the `<table>`."

accessibility:
  role: "table (native). No explicit role is emitted."
  why_not_grid: "TTable previously set role=\"grid\" without implementing the composite-widget keyboard model — no roving tabindex, no gridcell/row roles, no 2D arrow-key navigation. Screen readers switched to application/focus mode and offered cell navigation that did not exist. The role was removed so the component is honestly a reading table. An opt-in interactive grid mode is deliberately NOT offered until the keyboard model ships."
  accessible_name: "Use `caption` for a visible name or `aria-label` / `aria-labelledby` for an invisible one. Both land on the `<table>`."
  aria-sort: Set on sortable column headers (ascending, descending, none).
  keyboard: Sortable headers are focusable and activated with Enter or Space.
  scope: col on all th elements.

row_activation:
  note: >
    A row either NAVIGATES or it does not, and the API forces the choice —
    `rowHref`/`rowTo` and `rowActivatable` are mutually exclusive and dev builds
    say so. When the choice is not forced, a screen invents its own row
    activation — a click handler on the `<tr>`, a stretched overlay, a
    `role="button"` — and the contortion it picks has no correlation with
    whether the row navigates; offering two equivalent ways out reproduces that.
  rowHref_rowTo:
    shape: "A real `<a>` in the FIRST cell, stretched over the row by `::after`."
    why_not_a_tr: >
      A `<tr>` cannot be an `<a>` and cannot contain one: its only permitted
      content is `<td>`/`<th>`, and the parser hoists anything else out of the
      table.
    containing_block: >
      Only the cells AFTER the first are positioned. Positioning EVERY cell made
      the first one the overlay's containing block, so `inset: 0` covered that
      cell alone — the whole row showed pointer and hover while only the first
      cell navigated.
    affordance: >
      `is-linked` follows the RESOLVED target, not the presence of the prop: a
      row whose `rowTo` returns `undefined` renders no link and gets no pointer.
  rowActivatable:
    shape: "A real `<button>` in the first cell, stretched the same way."
    why_not_role_button_on_tr: >
      `role="button"` on a `<tr>` makes every cell presentational and destroys
      the table's grid semantics, so a row that is activatable AND contains a
      control had no accessible shape at all. A button in a cell also means a
      control in another cell never fires `row-activate` by accident.
  rowLabel: "Used by BOTH modes. Without it the name is every cell concatenated, per row."
  detail_slot:
    note: >
      Rendered as a `<tr>` adjacent to its own row. `aria-expanded`/
      `aria-controls` are NOT put on the `<tr>`: that announced every row as
      expandable and pointed at an id the consumer could not reach. The cell
      slot receives `detailId` and `expanded` so the control that actually
      toggles can carry them.

behavior:
  roles_are_declared_rather_than_implied: >-
    `role` is on the table, both rowgroups, every row, every column header and
    every cell. Each is the element's own implicit role, so nothing changes
    while `display: table` holds — they exist to survive stacked mode, where
    `display: block` drops the implicit table semantics in several screen
    readers and the block would be announced as a run of unrelated text.
    Measured in the accessibility tree: a stacked cell reads as
    "Saldo real R$ 1.284,30", carrying its column.
  containment_is_scoped_to_tables_that_use_it: >-
    `container-type: inline-size` applies `contain: layout inline-size style`,
    so it is set only on a wrapper carrying a `stack-below` modifier rather
    than on every table in the library.
  a_row_link_covers_the_whole_block: >-
    Outside stacked mode every cell after the first is raised above the
    stretched-link overlay, because those are neighbouring columns and one may
    hold a button. Stacked, those same cells are plain text under the title, and
    raising them punched a hole in the link. Inside the container query only
    cells that actually contain something focusable are raised — and never the
    first, which holds the overlay: positioning it makes it the overlay's
    containing block, and `inset: 0` then covers that cell alone.

name: TTagInput
source_file: packages/vue/src/components/TTagInput.vue
package: "@treeui/vue"
kind: form
status: available
purpose: "Edit a list of free-text strings as addable/removable chips (e.g. a service list). Free input, not selection from a fixed option set — use TMultiSelect/TCombobox for that."

props:
  modelValue:
    type: "string[]"
    default: "[]"
    note: "The tags. Arbitrary strings, in order."
  size:
    type: TSize
    default: md
    values: [sm, md, lg]
  width:
    type: TFieldWidth
    default: full
    values: [xs, sm, md, lg, xl, full]
  disabled:
    type: boolean
    default: false
  invalid:
    type: boolean
    default: false
  placeholder:
    type: string
    default: ""
    note: "Shown only while there are no tags."
  removeLabel:
    type: string
    default: Remove
    note: >
      Accessible name for each chip's remove button, forwarded to the underlying
      TTag. Localizable copy — the library ships an English default only as a
      fallback.
  allowDuplicates:
    type: boolean
    default: false
    note: >
      Keep repeated values instead of dropping them. Dedupe is right for a set of
      names and wrong for an ordered argument list, where `--param a --param b`
      is meaningful and losing the second `--param` silently corrupts the command
      that gets spawned.
  separator:
    type: "string | string[] | null"
    default: ","
    note: >
      Character(s) that confirm the current tag alongside Enter, both on keydown
      and when pasting. `null` makes Enter the only way to confirm — needed when
      the values legitimately contain the separator (`--param=tags=a,b` must stay
      one argument). An array accepts several.
  commitOnBlur:
    type: boolean
    default: true
    note: >
      Confirm the pending draft when the field loses focus. On by default because
      typing the last value and clicking Save otherwise dropped it with no
      warning — a defect independent of any one product.
  trim:
    type: boolean
    default: true
    note: >
      Trim each value and drop empty ones. Turn it off where a leading or
      trailing space is meaningful — with it off, the text still pending in the
      field keeps its spaces too.

events:
  - update:modelValue
  - name: "update:draft"
    payload: "[value: string]"
    description: >
      The pending, unconfirmed text (`v-model:draft`). A form that enables Save
      from a dirty count cannot see the draft otherwise, and `commitOnBlur` does
      not help there: clicking a DISABLED Save fires no mousedown, so the field
      never blurs and the user is left staring at a greyed-out button with the
      value in front of them.

exposed:
  - "focus(): focuses the text field."
  - "commit(): flushes the pending draft, for a form that turns commitOnBlur off."
  - "hasDraft: computed boolean, the imperative counterpart of `update:draft`."

a11y:
  chips_are_ttag_removable: true
  aria_invalid_when_invalid: true
  keyboard_enter_or_comma_adds: true
  keyboard_backspace_removes_last: true

behavior:
  values_are_free_strings: true
  enter_and_comma_confirm_current_tag: true
  pasted_comma_separated_string_splits_into_tags: true
  trims_and_dedupes_silently: "unless allowDuplicates"
  empty_after_trim_ignored: true
  no_autocomplete_or_suggestions: true
  reuses_ttag_for_chips: true

example: |
  <TFormField label="LocalStack services">
    <TTagInput
      :model-value="services"
      placeholder="Add a service…"
      @update:model-value="services = $event"
    />
  </TFormField>

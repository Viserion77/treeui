name: TText
source_file: packages/vue/src/components/TText.vue
package: "@treeui/vue"
kind: primitive
status: available
purpose: "Typography primitive for body text, labels and headings — size, tone, weight and truncation from tokens, with no hand-written CSS."

props:
  as:
    type: string
    default: span
    note: "Render element. Use `p`, `h1`–`h6`, `label`, `small`, `strong`, … for correct semantics."
  size:
    type: TTextSize
    default: undefined
    values: [xs, sm, md, lg, xl, 2xl, 3xl, 4xl, 5xl, display, title, subtitle, overline]
    note: >
      xs–5xl map to --tree-font-size-*. Three RESPONSIVE steps stay ordered at
      every viewport width, because two steps sharing a slope collapse into each
      other below the smaller one's cap: `display` (hero, clamp 3xl→5xl at 5vw),
      `title` (page or section heading, clamp xl→4xl at 4vw) and `subtitle`
      (the heading under one of those, clamp lg→2xl at 2.5vw — a gentler climb,
      not merely a lower ceiling). Measured title vs subtitle at 390/500/600/700px:
      22/22/24/28 against 18/18/18/18. `overline` is a closed eyebrow style
      (xs, semibold, uppercase, wide tracking) that leaves colour to `tone`.
      Omitted = inherit.
  tone:
    type: TTextTone
    default: default
    values: [default, muted, inverse, brand, danger, success, warning, info]
    note: >
      `default` inherits the current colour; `muted`/`inverse`/`brand` map to
      --tree-color-text-* / brand. The four STATUS tones read
      --tree-color-status-* (`danger` → `error`, the vocabulary-to-token mapping
      in CONTRACTS.yaml). They exist because a sentence that IS the state — the
      error line under a field, the green "connected" beside a resource — is not
      a TAlert (a box with an icon and the weight of an announcement) and not a
      TBadge/TTag (a pill, when the datum is prose). Without them the only way to
      say "this failed" in text was local CSS.
  weight:
    type: TTextWeight
    default: undefined
    values: [regular, medium, semibold, bold]
  family:
    type: TTextFamily
    default: undefined
    values: [sans, mono]
    note: "Font family. Omitted = inherit. `mono` maps to --tree-font-family-mono for inline code, IDs, ARNs and machine text — the token-driven alternative to a local monospace class. Not a substitute for a code/log block."
  wrap:
    type: TTextWrap
    default: undefined
    values: [anywhere, break-word]
    note: >
      Break axis for a string with no break opportunity — an id, ARN, API key or
      hash is one long word, so it overflows its box. `truncate` is the wrong
      answer when the string IS what the reader came to copy: an ellipsis makes
      an id useless. `anywhere` breaks at any character (and sets
      `min-inline-size: 0`, without which a flex or grid child still refuses to
      shrink below its longest word and never breaks); `break-word` only breaks a
      word that would otherwise overflow. Ignored when `truncate` is set.
  balance:
    type: boolean
    default: false
    note: >
      `text-wrap: balance` — evens out the line lengths of a short block, for
      headlines where a one-word last line reads as a mistake. Browsers without
      support wrap normally.
  truncate:
    type: boolean
    default: false
    note: "Clip to a single line with an ellipsis."
  preserveWhitespace:
    type: boolean
    default: false
    note: "Render authored line breaks and blank lines as written (`white-space: pre-wrap`) while still wrapping long lines. Use for plain-text output such as AI responses, so consumers never need a local `white-space: pre-wrap` class. Mutually exclusive with `truncate`, which needs `nowrap`; when both are set `truncate` wins and no `is-pre-wrap` class is emitted."
  measure:
    type: TTextMeasure
    default: undefined
    values: [headline, lead, prose]
    note: >
      Reading measure — a max-width in `ch` for legibility, rendered block so it
      applies. `headline` (~20ch, a hero or section headline), `lead` (~58ch,
      hero subtitle) and `prose` (~68ch, body). Closed axis so every surface caps
      at the same width without inventing a `ch` value (parallels
      treeFieldWidths for form controls).

slots:
  - default

behavior:
  semantic_element_controlled_by_as: true
  token_driven_size_tone_weight: true
  truncate_takes_precedence_over_preserve_whitespace: true

a11y:
  - "Choose `as` to convey the correct semantics (e.g. headings via h1–h6); TText adds only visual styling."

example: |
  <TText as="h1" size="lg" weight="semibold">Overview</TText>
  <TText tone="muted" size="sm">6.4 GB of 10 GB used</TText>

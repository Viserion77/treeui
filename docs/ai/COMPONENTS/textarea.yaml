name: TTextarea
source_file: packages/vue/src/components/TTextarea.vue
package: "@treeui/vue"
kind: primitive
status: available
purpose: "Multi-line text field with size, loading, invalid states, and auto-grow option."

props:
  modelValue:
    type: string
    default: ""
  size:
    type: TSize
    default: md
    values: [sm, md, lg]
  width:
    type: TFieldWidth
    default: full
    values: [xs, sm, md, lg, xl, full]
    note: "Inline-size cap (max-inline-size). Fluid by default; use instead of an inline width style."
  disabled:
    type: boolean
    default: false
  loading:
    type: boolean
    default: false
  invalid:
    type: boolean
    default: false
  placeholder:
    type: string
    default: ""
  rows:
    type: number
    default: 3
  autoGrow:
    type: boolean
    default: false
  maxRows:
    type: number
    default: undefined
    note: >
      Ceiling for `autoGrow`, in lines. Without it a composer grows forever and
      pushes the conversation off screen. At the cap the field starts scrolling
      internally (`overflow-y: auto` on the `<textarea>`) instead of growing,
      and the component's border and focus ring stop moving. Measured from the
      field's resolved line-height plus its vertical padding and border, so the
      cap follows `size` and the theme. Ignored when `autoGrow` is off.
  family:
    type: TTextareaFamily
    default: undefined
    values: [sans, mono]
    note: >
      Font family of the editable content, same vocabulary as TText. `mono` is
      for machine text — JSON, a policy document, a payload — which otherwise
      leaves a `.mono` class behind in the consumer's stylesheet. Applied to the
      `<textarea>`, not the label wrapper, which also holds the loading spinner.

events:
  - update:modelValue

slots: []

forwards_attrs_to: native_textarea

a11y:
  aria_invalid_when_invalid: true
  loading_uses_status_spinner: true

behavior:
  update_payload_type: string
  loading_does_not_disable_by_itself: true
  auto_grow_resizes_on_input: true
  auto_grow_also_resizes_on_mount: true
  auto_grow_stops_at_max_rows_and_scrolls: true
  auto_grow_works_uncontrolled: true

example: |
  <TTextarea
    aria-label="Message"
    :rows="1"
    auto-grow
    :max-rows="6"
    :model-value="draft"
    @update:model-value="draft = $event"
  />

element_attributes:
  note: "Same reason as TInput — see `input.yaml` -> `element_attributes`."
  declared: [readonly, minlength, maxlength, name, required, autocomplete]

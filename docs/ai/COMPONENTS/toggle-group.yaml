name: TToggleGroup
source_file: packages/vue/src/components/TToggleGroup.vue
package: "@treeui/vue"
kind: selection
status: available
purpose: "Segmented button group for single or multiple visible choices."

props:
  modelValue:
    type: "TToggleGroupModel<T, M> — `T` in single mode, `T[]` in multiple"
    default: undefined
    note: >
      Generic over the option type AND the selection mode, so the model is the
      type the call site actually has: `<TToggleGroup v-model="view">` with a
      `ref<'grid' | 'list'>` binds, and `selectionMode="multiple"` binds a
      `('grid' | 'list')[]`. It was `string | string[]` in and
      `string | string[] | undefined` out, which no literal-union ref could bind
      under a consumer's `strictTemplates` — the same defect as TTabs/TInput
      (TREEUX-011, group 3), found by the gate once it ran on the same `vue-tsc`
      major consumers use. `undefined` was never actually emitted.
  options:
    type: "TToggleGroupOption<NoInfer<T>>[]"
    default: "[]"
    note: >
      Array of `{ label, value, disabled? }`. `NoInfer` so the MODEL drives `T`,
      not the options: otherwise a group whose options list one value narrows
      `T` to it, and a `ref<'grid' | 'list'>` stops binding the moment an option
      is filtered out. Options are checked against the model instead, which is
      the direction that catches the real mistake — offering a value the model
      cannot hold.
  selectionMode:
    type: "M ('single' | 'multiple')"
    default: single
    values: [single, multiple]
    note: >
      No `withDefaults` entry, deliberately: a default value cannot be proven
      assignable to the type parameter it would fill in. The default is applied
      internally, so the runtime behaviour is unchanged.
  size:
    type: TSize
    default: md
    values: [sm, md, lg]
  variant:
    type: TToggleGroupVariant
    default: outline
    values: [outline, soft, solid]
  disabled:
    type: boolean
    default: false

events:
  - update:modelValue

slots:
  - option

a11y:
  roving_focus: true
  home_end_navigation: true
  arrow_navigation: true
  activation_keys_select_option: true

behavior:
  single_and_multiple_modes: true
  variant_changes_visual_style_only: true
  visible_option_set_expected: true

example: |
  <TToggleGroup
    aria-label="Time range"
    :options="rangeOptions"
    model-value="week"
    @update:model-value="range = $event"
  />

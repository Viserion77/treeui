# ─────────────────────────────────────────────────────────────
# TreeUI — Component Acceptance Criteria
# ─────────────────────────────────────────────────────────────
# The shared vocabulary for reviewing a component against the
# TreeUI conventions (STANDARDS.yaml, CONTRACTS.yaml). Cite a
# criterion id in a review, a PR, or a practice note.
#
# This file defines the criteria only. It deliberately carries no
# per-component ledger: a hand-maintained conformance table goes
# stale faster than anyone refreshes it, and the durable record of
# what a component does lives in COMPONENTS/*.yaml and in the tests.
#
# Status vocabulary for a review that uses these criteria:
#   PASS   — fully met
#   WARN   — partially met, improvement possible
#   FAIL   — not met, action required
#   N/A    — not applicable to this component
# ─────────────────────────────────────────────────────────────

version: "0.3"

# ═══════════════════════════════════════════════════════════════
# GLOBAL CRITERIA (apply to EVERY component)
# ═══════════════════════════════════════════════════════════════
global-criteria:
  naming:
    - id: NAM-01
      title: "Public export uses the T prefix"
      rule: "Exported as T<Name> (e.g. TButton), listed in CONTRACTS.yaml primary_exports"
    - id: NAM-03
      title: "Source file is named T<Name>.vue"
      rule: "SFC filename: T<Name>.vue"
    - id: NAM-04
      title: "CSS classes use BEM with the t- prefix"
      rule: "Classes: .t-<name>, .t-<name>--<variant>, .t-<name>__<element>"
    - id: NAM-05
      title: "CSS custom properties use --tree-*"
      rule: "No raw color/spacing values; always var(--tree-*)"
      enforced_by: "packages/tokens/src/contract.test.ts — fails on any colour literal outside primitives.ts"

  colour:
    - id: COL-01
      title: "Components name only semantic tokens"
      rule: >
        A component may reference the semantic layer and the derived state layer.
        It may never reference a primitive (they are not emitted) and never a
        literal colour.
      enforced_by: "packages/tokens/src/contract.test.ts"
    - id: COL-02
      title: "Interaction states come from the derived layer"
      rule: >
        Hover, press, selected and disabled use --tree-color-state-* or the
        family's derived tokens. Do not hand-write a color-mix() at the call
        site, and do not use opacity where a label sits on a surface.
      enforced_by: "review; docs/ai/TOKENS.yaml -> derived_variables lists every name"
    - id: COL-03
      title: "Every text/background pair the component renders passes AA"
      rule: >
        4.5:1 for normal text, 3:1 for UI elements and inactive controls. If a
        component introduces a new pair, add it to CONTRAST_PAIRS in
        packages/tokens/src/contract.ts so it is measured.
      enforced_by: "packages/tokens/src/validate.ts, run by contract.test.ts"
    - id: COL-04
      title: "Form control boundaries clear 3:1"
      rule: >
        The border that identifies an input, select, checkbox or radio uses
        --tree-color-border-interactive (WCAG 1.4.11). Cards, dividers and table
        rules keep --tree-color-border-default and are not held to it.
    - id: COL-05
      title: "A new colour value is added to TOKENS.yaml in the same change"
      rule: "docs/ai/TOKENS.yaml -> theme_values is the published contract."
      enforced_by: "packages/mcp/src/tokens-contract-sync.test.ts"

  structure:
    - id: STR-01
      title: "Uses <script setup lang='ts'>"
      rule: "Script setup with TypeScript, never the Options API"
    - id: STR-02
      title: "Props typed with defineProps<{}>()"
      rule: "Props declared with an inline interface plus withDefaults()"
    - id: STR-03
      title: "Emits typed with defineEmits<{}>()"
      rule: "Events typed with their payload signature"
    - id: STR-04
      title: "Uses the shared types (TSize, TVariant, …)"
      rule: "Imported from packages/vue/src/types/contracts.ts"
    - id: STR-05
      title: "Registered in the plugin"
      rule: "Registered in packages/vue/src/plugin.ts"

  styling:
    - id: CSS-01
      title: "No hardcoded colors"
      rule: "No hex/rgb/hsl value in the template or CSS; use var(--tree-color-*)"
    - id: CSS-02
      title: "No hardcoded spacing"
      rule: "padding/margin/gap use var(--tree-space-*)"
    - id: CSS-03
      title: "Type scale respected"
      rule: "font-size uses var(--tree-font-size-*), never an arbitrary px value"
    - id: CSS-04
      title: "Border radius uses tokens"
      rule: "border-radius uses var(--tree-radius-*)"
    - id: CSS-05
      title: "Shadows use tokens"
      rule: "box-shadow uses var(--tree-shadow-*)"
    - id: CSS-06
      title: "Motion uses tokens"
      rule: "transition duration/timing uses var(--tree-motion-*)"
    - id: CSS-07
      title: "Z-index uses tokens (overlays)"
      rule: "z-index uses var(--tree-z-*), never a raw number"

  states:
    - id: STA-01
      title: "Default state renders"
      rule: "The component renders correctly with no props beyond the required ones"
    - id: STA-02
      title: "Hover state styled"
      rule: ":hover defined with a clear visual change"
    - id: STA-03
      title: "Active/pressed state styled"
      rule: ":active defined"
    - id: STA-04
      title: "Disabled state styled"
      rule: "opacity + cursor: not-allowed; aria-disabled when the element is not natively disableable"
    - id: STA-05
      title: "Focus state visible"
      rule: ":focus-visible with a box-shadow using --tree-color-focus-ring"
    - id: STA-06
      title: "Loading state (where applicable)"
      rule: "Spinner visible and aria-busy='true'; see CONTRACTS.yaml shared_props.loading for when it may also block interaction"

  accessibility:
    - id: A11Y-01
      title: "Native HTML semantics"
      rule: "Uses <button>, <input>, <label>, role='dialog', etc."
    - id: A11Y-02
      title: "Keyboard: Tab/Shift+Tab navigates"
      rule: "Reachable with Tab, leavable with Shift+Tab"
    - id: A11Y-03
      title: "Keyboard: Escape closes (overlays)"
      rule: "Overlays/modals/drawers close on Escape"
    - id: A11Y-04
      title: "Keyboard: Enter/Space activates (interactive)"
      rule: "Interactive elements activate with Enter and Space"
    - id: A11Y-05
      title: "Keyboard: arrow keys (navigable collections)"
      rule: "Arrows move between items in lists/tabs/radios/menus"
    - id: A11Y-06
      title: "ARIA labels present"
      rule: "aria-label, aria-labelledby, or aria-describedby wherever a name or description is needed"
    - id: A11Y-07
      title: "Touch target ≥ 44×44px"
      rule: "Hit area expanded via padding or an ::after overlay. Densely packed inline controls are documented exceptions — see STANDARDS.yaml icons.touch-targets"
    - id: A11Y-08
      title: "Focus trap (modals/drawers)"
      rule: "Tab cycles first → last → first inside the overlay"
    - id: A11Y-09
      title: "Focus restore (overlays)"
      rule: "Focus returns to the trigger when the overlay closes"
    - id: A11Y-10
      title: "Screen reader: status announced"
      rule: "role='status' or aria-live for toasts/spinners/async results"

  documentation:
    - id: DOC-01
      title: "Storybook story exists"
      rule: "A file in apps/docs/src/stories/<Name>.stories.ts"
    - id: DOC-03
      title: "YAML contract up to date"
      rule: "docs/ai/COMPONENTS/<name>.yaml reflects the current props, events, and slots"
    - id: DOC-04
      title: "Unit tests exist"
      rule: "Tests covering the component's main behavior and its a11y contract"
    - id: DOC-05
      title: "Practice conformance declared"
      rule: "docs/ai/practices.json lists the named practices the component follows, and the story carries the matching practiceNote(...)"

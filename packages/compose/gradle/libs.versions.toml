# Version catalog for the TreeUI Compose port.
#
# One catalog for every module, which is the Gradle answer to the same problem
# the pnpm workspace solves with a single lockfile: a version named twice is a
# version that will eventually be two versions.
[versions]
kotlin = "2.1.0"
agp = "8.7.3"
androidx-core = "1.15.0"
compose-bom = "2024.12.01"
compose-compiler-report = "false"
activity-compose = "1.9.3"
kotest-assertions = "5.9.1"
# compileSdk 35 / minSdk 24: 24 is where the Compose runtime itself draws the
# line, so nothing is gained by going lower and a great deal is lost by it.
compile-sdk = "35"
min-sdk = "24"
target-sdk = "35"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
